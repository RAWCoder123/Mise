[functions.send-supplier-email]
verify_jwt = true

[functions.operational-workflows]
verify_jwt = true

[functions.request-account-deletion]
verify_jwt = true

[functions.account-onboarding]
verify_jwt = true

[functions.outreach-agent]
verify_jwt = false

[functions.outreach-webhook]
verify_jwt = false

[functions.outreach-unsubscribe]
verify_jwt = false
