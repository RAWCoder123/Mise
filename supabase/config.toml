project_id = "mise"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "http://localhost:8081",
  "http://127.0.0.1:8081",
  "http://localhost:8081/auth/callback",
  "http://127.0.0.1:8081/auth/callback",
  "mise://accept-invite",
  "mise://auth/callback"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Social login for Expo app + web. Secrets come from env — never commit them.
# Set SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID / SECRET (and Apple equivalents) before `supabase start`.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[functions.sync-pos-sales]
verify_jwt = true

[functions.generate-ai-insights]
verify_jwt = true

[functions.link-gmail]
verify_jwt = true

[functions.gmail-oauth-callback]
verify_jwt = false

[functions.link-square]
verify_jwt = true

[functions.square-oauth-callback]
verify_jwt = false

[functions.square-webhooks]
verify_jwt = false

[functions.send-supplier-email]
verify_jwt = true

[functions.operational-workflows]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.export-restaurant-data]
verify_jwt = true

[functions.outreach-agent]
verify_jwt = false

[functions.outreach-webhook]
verify_jwt = false

[functions.outreach-unsubscribe]
verify_jwt = false
