version: 2.1

orbs:
  browser-tools: circleci/browser-tools@2.4.2

jobs:
  verify:
    docker:
      - image: cimg/node:22.13-browsers
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Typecheck
          command: npm run typecheck
      - run:
          name: Unit tests
          command: npm test
      - run:
          name: High severity dependency audit
          command: npm audit --audit-level=high
      - run:
          name: Expo project health
          command: npm run doctor
      - run:
          name: Design-system static checks
          command: npm run design:static
      - run:
          name: Web export smoke test
          command: npx expo export --platform web --output-dir /tmp/mise-web-export
      - run:
          name: Route smoke checks
          command: npm run qa:routes
      - browser-tools/install_chrome
      - run:
          name: Mobile layout and interaction checks
          command: npm run qa:interactions
          no_output_timeout: 10m

  db_security:
    docker:
      - image: cimg/node:22.13
    working_directory: ~/project
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: false
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Backend security gate
          command: npm run security:backend
      - run:
          name: Run migration, RLS, concurrency, and advisor tests
          command: npm run supabase:test
          no_output_timeout: 10m

  staging_security:
    docker:
      - image: cimg/node:22.13-browsers
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - browser-tools/install_chrome
      - run:
          name: Hosted private-beta security closure
          command: npm run verify:private-beta-security:hosted
          no_output_timeout: 10m

workflows:
  mise_verify:
    jobs:
      - verify
      - db_security
      - staging_security:
          context: mise-staging-security
          requires:
            - verify
            - db_security
          filters:
            branches:
              only: main
