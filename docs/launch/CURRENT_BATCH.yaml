batch_id: private-beta-daily-findings-contract-14
status: completed
goal: Generate a deterministic tenant-scoped daily brief with bounded evidence, confidence, freshness, missing-data warnings, and Now/Up next/Later priority.
started_at: 2026-07-27
codex_owned:
  - docs/launch/**
  - services/domain/operationalFindings.ts
  - services/application/findings.ts
  - services/miseService.ts
  - tests/**
cursor_owned: []
shared_locked: []
blocked_files:
  - app/**
  - i18n/catalog.ts
handoff_required: true
dependencies:
  - private-beta-data-export-authority-13
required_tests:
  - npm run typecheck
  - npm test
stop_conditions:
  - Evidence references cross restaurants
  - Confidence falls outside zero to one
  - Missing or stale data is presented as fresh evidence
  - Generative AI is required for any finding
  - Findings create inventory events or supplier orders
evidence:
  - One read-only repository snapshot feeds each brief
  - Findings are tenant-fail-closed before evidence construction
  - Recommendations, rule insights, sales gaps, inventory gaps, and mapping gaps produce bounded findings
  - Every finding includes severity, priority, confidence, evidence, affected workflow, action, source window, freshness, missing data, and policy version
  - Now, Up next, and Later contain stable finding IDs in deterministic order
  - Stale and incomplete evidence lower confidence or produce explicit data-quality work
  - The brief is capped at 12 findings and five evidence references per finding
  - No AI provider, inventory mutation, supplier draft, or send path is imported
  - npm run typecheck passed
  - npm test passed with 271 tests
  - npm run security:backend passed
unresolved_findings:
  - Cursor must surface the brief contract in Today/Insights with localized scan-first sections
  - Append-only feedback for non-order findings remains a separate backend batch
