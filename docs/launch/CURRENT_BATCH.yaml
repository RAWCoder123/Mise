batch_id: private-beta-operator-ui-21
status: in_progress
goal: Surface deterministic daily findings, restart-safe manager feedback, and owner/admin restaurant export in a polished mobile UI.
started_at: 2026-07-28
codex_owned:
  - docs/launch/**
cursor_owned:
  - app/(tabs)/today.tsx
  - app/(tabs)/insights.tsx
  - app/(tabs)/settings.tsx
  - app/settings/**
  - components/dailyBrief/**
  - i18n/catalog.ts
  - focused UI tests
shared_locked:
  - services/miseService.ts
blocked_files:
  - services/**
  - supabase/**
  - scripts/**
  - package.json
  - package-lock.json
  - app.json
handoff_required: true
dependencies:
  - private-beta-release-authority-20
required_tests:
  - npm run typecheck
  - npm test
  - npm run design:static
  - npm run qa:interactions
stop_conditions:
  - A screen calls a repository, Supabase, provider, or direct finding-record method
  - Original finding evidence or recommended action is hidden or rewritten after feedback
  - Staff can submit manager feedback or restaurant exports
  - Retry identity is regenerated after an ambiguous result
  - Any supported route or locale overflows or loses accessible controls
evidence: []
unresolved_findings:
  - Real-device proof remains separate release evidence
checkpoint_commit: null
